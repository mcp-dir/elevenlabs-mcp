# Smithery configuration for ElevenLabs
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_elevenlabs

name: elevenlabs-mcp
displayName: "ElevenLabs"
description: >
  ElevenLabs em linguagem natural: gere fala em qualquer idioma, crie e gerencie vozes, componha música, dublagem, dicionários de pronúncia, histórico e uso da conta. Você conecta com a sua própria API key do ElevenLabs, e os créditos saem da sua assinatura.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/elevenlabs-mcp
repository: https://github.com/mcp-dir/elevenlabs-mcp

tags:
  - elevenlabs
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_elevenlabs

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_elevenlabs/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
